<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Political Simulator 2025</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="app">
        <!-- Background Layer (Map/Effects) -->
        <div id="background-layer"></div>
        <div id="cloud-layer"></div>
        <div id="city-silhouette"></div>

        <!-- Top Bar: Global Stats -->
        <header id="top-bar" class="glass-panel">
            <div class="country-info">
                <span id="country-flag">🏳️</span>
                <div class="titles">
                    <h1 id="country-name">Country Name</h1>
                    <h2 id="leader-name">Leader Name</h2>
                </div>
            </div>

            <div class="stats-ticker">
                <div class="stat-item tooltip-target" data-tooltip="political-capital">
                    <span class="icon">🏛️</span>
                    <span class="value" id="stat-pc">0</span>
                    <span class="label">Capital</span>
                </div>
                <div class="stat-item tooltip-target" data-tooltip="budget">
                    <span class="icon">💰</span>
                    <span class="value" id="stat-budget">$0B</span>
                    <span class="label">Budget</span>
                </div>
                <div class="stat-item tooltip-target" data-tooltip="approval">
                    <span class="icon">📊</span>
                    <span class="value" id="stat-approval">50%</span>
                    <span class="label">Approval</span>
                </div>
            </div>

            <div class="date-display">
                <span id="game-date">Jan 1, 2025</span>
                <button id="btn-pause" class="icon-btn">⏸️</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-interface">
            <!-- Left: News & Events -->
            <section id="panel-left" class="glass-panel">
                <h3>News Feed</h3>
                <div id="news-feed-container">
                    <!-- News Items will be injected here -->
                    <div class="news-item">
                        <span class="date">Jan 1</span>
                        <p>Welcome to office, Mr. President.</p>
                    </div>
                </div>
            </section>

            <!-- Center: Dashboard / Map / Dilemma Modal -->
            <section id="panel-center">
                <!-- Dynamic Content Views -->
                <div id="view-dashboard" class="active-view">
                    <!-- Cabinets, Advisors, etc -->
                </div>
            </section>

            <!-- Right: Factions & advisors -->
            <section id="panel-right" class="glass-panel">
                <h3>Factions</h3>
                <div id="factions-list">
                    <!-- Injected Faction Bars -->
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Container for Dilemmas/Events -->
    <div id="modal-container" class="hidden">
        <div id="dilemma-modal" class="glass-panel modal-content">
            <h2 id="dilemma-title">Event Title</h2>
            <p id="dilemma-description">Event Description goes here...</p>
            <div id="dilemma-choices">
                <!-- Choice Buttons -->
            </div>
        </div>
    </div>

    <!-- Tooltip Element -->
    <div id="tooltip" class="hidden"></div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
